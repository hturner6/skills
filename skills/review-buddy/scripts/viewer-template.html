<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{--tk-kw:#a626a4;--tk-str:#0b7a3b;--tk-com:#6a737d;--tk-num:#b45309;--tk-fn:#1d4ed8;--tk-ty:#0e7490;--bg:#fff;--fg:#1c1e21;--mut:#5f6368;--card:#f4f5f7;--bd:#d8dbe0;--add:#e6f6ea;--addhi:#b8e6c2;--del:#fdecea;--delhi:#f5bcb5;--hunk:#eef2fb;--must:#c0392b;--skim:#b8860b;--acc:#2563eb;--note:#fff8e1}
@media(prefers-color-scheme:dark){:root{--tk-kw:#d19aff;--tk-str:#7ee2a0;--tk-com:#8b949e;--tk-num:#ffb86b;--tk-fn:#79b8ff;--tk-ty:#56d4dd;--bg:#16181c;--fg:#e8eaed;--mut:#9aa0a6;--card:#22252b;--bd:#363a42;--add:#1b3324;--addhi:#2a5a3a;--del:#3a2022;--delhi:#6b2f33;--hunk:#222a3a;--must:#ff7a6b;--skim:#e6b94d;--acc:#6ea0ff;--note:#3a3320}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.6 system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:270px;flex:none;border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:14px;margin:0 6px 10px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:inherit;font:inherit;font-size:13px;padding:7px 8px;cursor:pointer;border-radius:4px}
nav button:hover{background:var(--card)}nav button.cur{background:var(--card);border-left-color:var(--acc)}
nav .tier-must{border-left-color:var(--must)}nav .tier-skim{border-left-color:var(--skim)}
nav .mark{float:right;font-size:12px}
.prog{font-size:12px;color:var(--mut);margin:0 8px 10px}
main{flex:1;min-width:0;padding:24px 32px 48px;max-width:1200px}
h2{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid currentColor;margin-right:6px;vertical-align:middle}
.badge.must{color:var(--must)}.badge.skim{color:var(--skim)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px 14px;margin:10px 0}
.box b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:2px}
.box.visual{border-style:dashed}
.file{border:1px solid var(--bd);border-radius:6px;margin:16px 0;overflow:hidden}
.fh{background:var(--card);padding:6px 12px;font:13px ui-monospace,monospace;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tools button,.marks button,.pager button{font:inherit;font-size:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:4px;padding:3px 10px;cursor:pointer}
.tools button.on,.marks button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
table.diff{width:100%;border-collapse:collapse;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;table-layout:fixed}
.diff td{padding:0 8px;vertical-align:top;white-space:pre-wrap;word-break:break-all}
.diff td.mk{text-align:center;padding:0;color:var(--mut)}
.diff td.no{text-align:right;color:var(--mut);user-select:none;padding:0 6px}
.diff tr.add td.c,.diff td.c.add{background:var(--add)}.diff tr.add td.no.n{background:var(--addhi)}
.diff tr.del td.c,.diff td.c.del{background:var(--del)}.diff tr.del td.no.o{background:var(--delhi)}
.diff tr.hunk td{background:var(--hunk);color:var(--mut);padding:2px 10px}
.hljs-keyword,.hljs-literal,.hljs-built_in,.hljs-selector-tag,.hljs-meta{color:var(--tk-kw)}
.hljs-string,.hljs-regexp,.hljs-code,.hljs-link,.hljs-attr,.hljs-symbol,.hljs-bullet{color:var(--tk-str)}
.hljs-comment,.hljs-quote,.hljs-doctag{color:var(--tk-com);font-style:italic}
.hljs-number,.hljs-variable,.hljs-template-variable,.hljs-params{color:var(--tk-num)}
.hljs-title,.hljs-function,.hljs-section,.hljs-name,.hljs-selector-class,.hljs-selector-id{color:var(--tk-fn)}
.hljs-type,.hljs-class,.hljs-tag,.hljs-property{color:var(--tk-ty)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
.diff td.empty{background:var(--card)}
.diff tr.note td{background:var(--note);padding:8px 14px;white-space:normal;font:14px/1.45 system-ui,sans-serif;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.diff tr.note td b{font-size:11px;text-transform:uppercase;color:var(--mut);margin-right:6px}
.marks{margin:18px 0}.marks span{font-size:13px;color:var(--mut);margin-right:8px}.marks button{margin-right:6px}
.pager{display:flex;justify-content:space-between;margin-top:22px}
.lead{font-size:17px;line-height:1.55;margin:8px 0 6px}
.prose{max-width:70ch}.prose p{margin:0 0 .7em;white-space:pre-line}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:30px 0 10px;display:flex;gap:8px;align-items:center}
.count{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 8px;font-size:12px;letter-spacing:0}
.finding{border:1px solid var(--bd);border-left:4px solid var(--mut);border-radius:6px;padding:10px 14px;margin:8px 0;max-width:82ch;background:var(--card)}
.finding.sev-high{border-left-color:var(--must)}.finding.sev-med{border-left-color:var(--skim)}
.fh2{display:flex;gap:10px;align-items:baseline}
.sev{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);flex:none}
.sev-high .sev{color:var(--must)}.sev-med .sev{color:var(--skim)}
.finding .prose{margin-top:4px;color:var(--mut);font-size:14.5px}
a.go{display:inline-block;margin-left:8px;font-size:13px;color:var(--acc);cursor:pointer;text-decoration:none}
a.go:hover{text-decoration:underline}
.callout{border-left:4px solid var(--acc);background:var(--card);padding:10px 16px;border-radius:0 6px 6px 0;margin:14px 0;max-width:82ch}
.callout b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc);margin-bottom:4px}
.callout.dashed{border-left-style:dashed;border-left-color:var(--mut)}.callout.dashed b{color:var(--mut)}
.list{margin:4px 0 4px 1.3em;padding:0;max-width:70ch}.list li{margin:4px 0}
details.more{margin:14px 0;max-width:82ch;color:var(--mut);font-size:14.5px}details.more summary{cursor:pointer;margin-bottom:6px}
nav button .num{display:inline-block;width:22px;color:var(--mut);font-size:12px}
nav button .cnt{float:right;font-size:11px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:0 6px;margin-left:6px}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--bd)}main{padding:14px 16px}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script id="data" type="application/json">
__DATA__
</script>
<script>
// <pure>
// Parse a unified diff (as printed by show-diff.sh) into hunks of rows.
// Row: {t:'ctx'|'add'|'del', o:oldLine|null, n:newLine|null, s:text}
function parseDiff(text){
  var hunks=[],cur=null,o=0,n=0;
  String(text||'').split('\n').forEach(function(line){
    var m=/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(line);
    if(m){cur={header:line,rows:[]};hunks.push(cur);o=+m[1];n=+m[3];return;}
    if(!cur||line==='')return;
    var c=line.charAt(0),s=line.slice(1);
    if(c==='+')cur.rows.push({t:'add',o:null,n:n++,s:s});
    else if(c==='-')cur.rows.push({t:'del',o:o++,n:null,s:s});
    else if(c===' ')cur.rows.push({t:'ctx',o:o++,n:n++,s:s});
  });
  return hunks;
}
// Pair deleted and added runs side by side: [{l:row|null, r:row|null}]
function pairRows(rows){
  var out=[],i=0;
  while(i<rows.length){
    var r=rows[i];
    if(r.t==='ctx'){out.push({l:r,r:r});i++;continue;}
    var dels=[],adds=[];
    while(i<rows.length&&rows[i].t==='del')dels.push(rows[i++]);
    while(i<rows.length&&rows[i].t==='add')adds.push(rows[i++]);
    for(var k=0;k<Math.max(dels.length,adds.length);k++)out.push({l:dels[k]||null,r:adds[k]||null});
  }
  return out;
}
// </pure>
if(typeof document!=='undefined'){(function(){
var DATA=JSON.parse(document.getElementById('data').textContent);
var stops=DATA.stops||[];
var views=[{id:'overview',title:'Overview'}].concat(stops);
var cur=0,mode='unified',marks={};
var KEY='review-buddy:'+(DATA.title||'');
try{marks=JSON.parse(localStorage.getItem(KEY)||'{}');mode=localStorage.getItem(KEY+':mode')||mode;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(marks));localStorage.setItem(KEY+':mode',mode);}catch(e){}}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
var LANG={sh:'bash',bash:'bash',zsh:'bash',js:'javascript',mjs:'javascript',cjs:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',py:'python',rb:'ruby',go:'go',rs:'rust',java:'java',kt:'kotlin',c:'c',h:'c',cpp:'cpp',cc:'cpp',hpp:'cpp',cs:'csharp',php:'php',swift:'swift',lua:'lua',pl:'perl',r:'r',sql:'sql',css:'css',scss:'scss',less:'less',html:'xml',xml:'xml',svg:'xml',json:'json',yml:'yaml',yaml:'yaml',toml:'ini',ini:'ini',md:'markdown',mk:'makefile',graphql:'graphql',gql:'graphql'};
function langOf(path){
  var base=path.split('/').pop(),ext=base.indexOf('.')>=0?base.split('.').pop().toLowerCase():'';
  if(base==='Makefile')return'makefile';
  return LANG[ext]||null;
}
// A code cell; highlighted per line when highlight.js loaded and the language is known, else plain text.
function codeCell(cls,text,lang){
  var td=el('td',cls);
  try{
    if(lang&&window.hljs&&hljs.getLanguage(lang)){td.innerHTML=hljs.highlight(text,{language:lang,ignoreIllegals:true}).value;return td;}
  }catch(e){}
  td.textContent=text;return td;
}
var MARK={ok:'\u2713',concern:'!',question:'?'};
var SEV={high:0,med:1,low:2},SEVLABEL={high:'High',med:'Medium',low:'Low'};
function box(label,text,cls){var b=el('div','box '+(cls||''));b.appendChild(el('b',null,label));b.appendChild(document.createTextNode(text));return b;}
// Text fields: a string becomes paragraphs (blank line = new paragraph), an array becomes a list.
function paras(text){var d=el('div','prose');String(text).split(/\n{2,}/).forEach(function(p){d.appendChild(el('p',null,p));});return d;}
function stopIndex(id){for(var i=1;i<views.length;i++)if(views[i].id===id)return i;return -1;}
function stopLink(id){
  var i=stopIndex(id);if(i<0)return document.createTextNode('');
  var a=el('a','go','Go to stop '+i+' \u2192');a.href='#';a.onclick=function(e){e.preventDefault();go(i);};return a;
}
function bullets(items,ordered){
  var u=el(ordered?'ol':'ul','list');
  items.forEach(function(it){
    var li=el('li');
    if(typeof it==='string')li.textContent=it;
    else{li.appendChild(document.createTextNode(it.text));if(it.stop)li.appendChild(stopLink(it.stop));}
    u.appendChild(li);
  });
  return u;
}
function textOrList(v){return Array.isArray(v)?bullets(v):paras(v);}
function section(title,count){var h=el('h3',null,title);if(count!=null)h.appendChild(el('span','count',String(count)));return h;}
function findingCard(f){
  var sev=SEV[f.severity]==null?'low':f.severity;
  var c=el('div','finding sev-'+sev),head=el('div','fh2');
  head.appendChild(el('span','sev',SEVLABEL[sev]));head.appendChild(el('strong',null,f.title));c.appendChild(head);
  if(f.detail)c.appendChild(paras(f.detail));
  if(f.stop)c.appendChild(stopLink(f.stop));
  return c;
}
function findingsFor(id){return (DATA.findings||[]).filter(function(f){return f.stop===id;});}

function renderNav(){
  var nav=document.getElementById('nav');nav.textContent='';
  nav.appendChild(el('h1',null,DATA.title||'Review'));
  var done=stops.filter(function(s){return marks[s.id];}).length;
  nav.appendChild(el('div','prog',done+' of '+stops.length+' stops marked'));
  views.forEach(function(v,i){
    var b=el('button',(i===cur?'cur ':'')+(v.tier?'tier-'+v.tier:''));
    if(i>0)b.appendChild(el('span','num',String(i)));
    if(marks[v.id]){b.appendChild(el('span','mark',MARK[marks[v.id]]));}
    var n=i===0?(DATA.findings||[]).length:findingsFor(v.id).length;
    if(n)b.appendChild(el('span','cnt',n+(n===1?' finding':' findings')));
    b.appendChild(document.createTextNode(v.title));
    b.onclick=function(){go(i);};nav.appendChild(b);
  });
}

function noteRows(notes,line,side,cols){
  return (notes||[]).filter(function(n){return n.line===line&&(n.side||'new')===side;}).map(function(n){
    var tr=el('tr','note'),td=el('td');td.colSpan=cols;td.appendChild(el('b',null,'AI note'));td.appendChild(document.createTextNode(n.text));tr.appendChild(td);return tr;
  });
}
function colgroup(widths){
  var cg=document.createElement('colgroup');
  widths.forEach(function(w){var c=document.createElement('col');if(w)c.style.width=w;cg.appendChild(c);});
  return cg;
}
function unified(hunks,notes,lang){
  // Hide the old-line column when nothing in the file existed before (a new file).
  var showOld=hunks.some(function(h){return h.rows.some(function(r){return r.t!=='add';});});
  var cols=showOld?4:3;
  var t=el('table','diff');
  t.appendChild(colgroup(showOld?['48px','48px','20px',null]:['48px','20px',null]));
  hunks.forEach(function(h){
    var hr=el('tr','hunk'),hd=el('td',null,h.header);hd.colSpan=cols;hr.appendChild(hd);t.appendChild(hr);
    h.rows.forEach(function(r){
      var tr=el('tr',r.t);
      if(showOld)tr.appendChild(el('td','no o',r.o==null?'':r.o));
      tr.appendChild(el('td','no n',r.n==null?'':r.n));
      tr.appendChild(el('td','c mk',(r.t==='add'?'+':r.t==='del'?'-':' ')));tr.appendChild(codeCell('c',r.s,lang));
      t.appendChild(tr);
      noteRows(notes,r.n!=null?r.n:r.o,r.n!=null?'new':'old',cols).forEach(function(x){t.appendChild(x);});
    });
  });
  return t;
}
function sideBySide(hunks,notes,lang){
  var t=el('table','diff');
  t.appendChild(colgroup(['48px',null,'48px',null]));
  hunks.forEach(function(h){
    var hr=el('tr','hunk'),hd=el('td',null,h.header);hd.colSpan=4;hr.appendChild(hd);t.appendChild(hr);
    pairRows(h.rows).forEach(function(p){
      var tr=el('tr');
      [p.l,p.r].forEach(function(r,i){
        if(!r){tr.appendChild(el('td','no'));tr.appendChild(el('td','c empty'));return;}
        var cls=r.t==='ctx'?'':r.t;
        tr.appendChild(el('td','no',(i===0?r.o:r.n)));tr.appendChild(codeCell('c '+cls,r.s,lang));
      });
      t.appendChild(tr);
      if(p.r&&p.r.n!=null)noteRows(notes,p.r.n,'new',4).forEach(function(x){t.appendChild(x);});
      else if(p.l&&p.l.o!=null)noteRows(notes,p.l.o,'old',4).forEach(function(x){t.appendChild(x);});
    });
  });
  return t;
}
function renderFile(f){
  var d=el('div','file'),fh=el('div','fh');
  fh.appendChild(el('span',null,f.path+(f.range?'  ('+f.range+')':'')));
  var tools=el('span','tools');
  ['unified','split'].forEach(function(m){
    var b=el('button',mode===m?'on':'',m==='unified'?'Unified':'Side by side');
    b.onclick=function(){mode=m;save();render();};tools.appendChild(b);
  });
  fh.appendChild(tools);d.appendChild(fh);
  var hunks=parseDiff(f.diff);
  d.appendChild(hunks.length?(mode==='unified'?unified(hunks,f.notes,langOf(f.path)):sideBySide(hunks,f.notes,langOf(f.path))):el('div','box','No diff for this range.'));
  return d;
}
function renderOverview(m){
  var must=stops.filter(function(s){return s.tier==='must';}).length;
  m.appendChild(el('h2',null,DATA.title||'Review'));
  m.appendChild(el('div','sub',stops.length+' stops ('+must+' must-read) \u00b7 the AI\u2019s reading of the PR, not verified fact'));
  if(DATA.summary){var l=paras(DATA.summary);l.className+=' lead';m.appendChild(l);}
  var fs=(DATA.findings||[]).slice().sort(function(a,b){return (SEV[a.severity]==null?2:SEV[a.severity])-(SEV[b.severity]==null?2:SEV[b.severity]);});
  if(fs.length){m.appendChild(section('Findings',fs.length));fs.forEach(function(f){m.appendChild(findingCard(f));});}
  if(DATA.lookAt&&DATA.lookAt.length){m.appendChild(section('Where to look first'));m.appendChild(bullets(DATA.lookAt,true));}
  if(DATA.ci){m.appendChild(section('CI and testing'));m.appendChild(textOrList(DATA.ci));}
  if(Array.isArray(DATA.overview))DATA.overview.forEach(function(o){m.appendChild(section(o.title));m.appendChild(textOrList(o.body));});
  if(DATA.skipped&&DATA.skipped.length){
    var d=el('details','more');d.appendChild(el('summary',null,'Approved to skip ('+DATA.skipped.length+')'));d.appendChild(bullets(DATA.skipped));m.appendChild(d);
  }
}
function renderStop(m,v){
  var h=el('h2');h.appendChild(el('span','badge '+v.tier,v.tier==='must'?'must-read':'skim'));h.appendChild(document.createTextNode(v.title));m.appendChild(h);
  var nf=(v.files||[]).length;
  m.appendChild(el('div','sub','Stop '+cur+' of '+stops.length+' \u00b7 '+nf+(nf===1?' file':' files')));
  if(v.why){var w=paras(v.why);w.className+=' lead';m.appendChild(w);}
  if(v.lookFor){var c=el('div','callout');c.appendChild(el('b',null,'What to look for'));c.appendChild(textOrList(v.lookFor));m.appendChild(c);}
  var fs=findingsFor(v.id);
  if(fs.length){m.appendChild(section('Findings on this stop',fs.length));fs.forEach(function(f){var c=findingCard(f);m.appendChild(c);});}
  (v.files||[]).forEach(function(f){m.appendChild(renderFile(f));});
  var mk=el('div','marks');mk.appendChild(el('span',null,'Your call:'));
  ['ok','concern','question'].forEach(function(k){
    var b=el('button',marks[v.id]===k?'on':'',MARK[k]+' '+k);
    b.onclick=function(){if(marks[v.id]===k)delete marks[v.id];else marks[v.id]=k;save();render();};mk.appendChild(b);
  });
  m.appendChild(mk);
  if(v.unverified){var d=el('details','more');d.appendChild(el('summary',null,'Not verified by the AI'));d.appendChild(textOrList(v.unverified));m.appendChild(d);}
  if(v.visual){var vc=el('div','callout dashed');vc.appendChild(el('b',null,'A visual the AI can make'));vc.appendChild(textOrList(v.visual));m.appendChild(vc);}
  m.appendChild(el('div','sub','Marks are saved in this browser only. Tell the AI about concerns in the terminal so it can draft them.'));
}
function render(){
  var m=document.getElementById('main');m.textContent='';
  if(cur===0)renderOverview(m);else renderStop(m,views[cur]);
  var pg=el('div','pager'),prev=el('button',null,'← Previous'),next=el('button',null,'Next →');
  prev.disabled=cur===0;next.disabled=cur===views.length-1;
  prev.onclick=function(){go(cur-1);};next.onclick=function(){go(cur+1);};
  pg.appendChild(prev);pg.appendChild(next);m.appendChild(pg);
  renderNav();
}
function go(i){if(i<0||i>=views.length)return;cur=i;render();window.scrollTo(0,0);}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='j'||e.key==='ArrowRight')go(cur+1);else if(e.key==='k'||e.key==='ArrowLeft')go(cur-1);
});
document.title=(DATA.title||'Review')+' · review viewer';
render();
})();}
</script>
</body>
</html>
